packages:
  - packages/*
# pnpm 11's default soak mode is loose: on meeting a package younger than
# `minimumReleaseAge` it appends the version to `minimumReleaseAgeExclude` and
# carries on. Strict mode makes it fail instead, so every exclusion below is a
# deliberate, reviewed decision.
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true

# First-party packages are exempt from the soak.
#
# The soak exists to stop a COMPROMISED THIRD-PARTY release being pulled into a build
# within hours of publication. It does not describe our own packages: we control what
# goes into them, and a first-party release is reviewed before it is published, not
# after. Applying it to ourselves only means a fresh publish is invisible to the next
# repo in the chain for 24h.
minimumReleaseAgeExclude:
  - assertron
  - satisfier
  - tersify
  - unpartial
  - type-plus
  - path-equal
  - iso-error
  - iso-error-web
  - iso-error-google-cloud-api
  - google-cloud-api
  - standard-log
  - standard-log-color
  - async-fp
  - fsa-emitter
  - progress-str
  - clibuilder
  - args-minus
  - global-store
  - stable-store
  - mocktomata
  - just-func
  - storybook-addon-vis
  - vitest-plugin-vis
  - node-supported-releases
  - '@just-func/*'
  - '@just-web/*'
  - '@mocktomata/*'
  - '@repobuddy/*'
  - '@unional/*'
# All dev-only, all reaching the tree through tools whose own latest release
# still resolves a vulnerable version, so there is no parent left to bump.
# None of these ship to consumers. Drop each entry once its parent resolves a
# patched version on its own.
overrides:
  # GHSA advisories on ReDoS in brace expansion (dev: glob chains under depcheck,
  # rimraf and vitest).
  brace-expansion@1: ^1.1.18
  brace-expansion@2: ^2.1.4
  brace-expansion@>=4: ^5.0.9
  # Prototype-pollution and code-execution advisories (dev: depcheck, redocly).
  js-yaml@3: ^3.15.1
  js-yaml@4: ^4.3.1
  # Host confusion via failed IDN canonicalization (dev: commitlint -> ajv).
  fast-uri@3: ^3.1.5
  # Non-uniform id generation (dev: depcheck -> postcss).
  nanoid@3: ^3.3.18
  postcss@8: ^8.5.23

allowBuilds:
  esbuild: true
  fsevents: true
